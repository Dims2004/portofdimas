<text x="90" y="300" font-family="Menlo,Consolas,monospace" font-size="22" fill="#0a84ff" fill-opacity=".28">const dimas = {</text>
<text x="90" y="330" font-family="Menlo,Consolas,monospace" font-size="22" fill="#0a84ff" fill-opacity=".28">  bidang: "IoT",</text>
<text x="90" y="360" font-family="Menlo,Consolas,monospace" font-size="22" fill="#0a84ff" fill-opacity=".28">  ai: true,</text>
<text x="90" y="390" font-family="Menlo,Consolas,monospace" font-size="22" fill="#0a84ff" fill-opacity=".28">};</text>
<text x="90" y="420" font-family="Menlo,Consolas,monospace" font-size="22" fill="#0a84ff" fill-opacity=".28"></text>
<text x="90" y="450" font-family="Menlo,Consolas,monospace" font-size="22" fill="#0a84ff" fill-opacity=".28">function nyala(led) {</text>
<text x="90" y="480" font-family="Menlo,Consolas,monospace" font-size="22" fill="#0a84ff" fill-opacity=".28">  return led ^ 1;</text>
<text x="90" y="510" font-family="Menlo,Consolas,monospace" font-size="22" fill="#0a84ff" fill-opacity=".28">}</text>
<text x="1380" y="420" font-family="Menlo,Consolas,monospace" font-size="22" fill="#bf5af2" fill-opacity=".28">if (suhu &gt; 30) {</text>
<text x="1380" y="450" font-family="Menlo,Consolas,monospace" font-size="22" fill="#bf5af2" fill-opacity=".28">  kipas.on();</text>
<text x="1380" y="480" font-family="Menlo,Consolas,monospace" font-size="22" fill="#bf5af2" fill-opacity=".28">}</text>
<text x="1380" y="510" font-family="Menlo,Consolas,monospace" font-size="22" fill="#bf5af2" fill-opacity=".28"></text>
<text x="1380" y="540" font-family="Menlo,Consolas,monospace" font-size="22" fill="#bf5af2" fill-opacity=".28">SELECT * FROM sensor</text>
